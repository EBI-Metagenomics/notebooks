project:
    type: website
    render:
        - src/docs.qmd
        - src/docs/*.md
        - src/docs/*.qmd
        - src/docs/analysis/version5/analysis.md
        - src/docs/analysis/version6/analysis.md
        - src/docs/analysis/version6/amplicon.md
        - src/docs/analysis/version6/raw-reads.md
        - src/docs/analysis/version6/assembly.md
        - src/docs/analysis/version6/assembly-annotation.md
        - src/docs/analysis/version6/virify.md
        - src/docs/analysis/version6/mobilome.md
        - src/examples/*.qmd

execute:
    freeze: auto

website:
    title: MGnify Resources
    site-url: https://docs.mgnify.org
    favicon: src/static-resources/mgnify_logo.png
    page-navigation: true

    repo-url: https://github.com/ebi-metagenomics/notebooks
    repo-actions: [edit, issue]

    navbar:
        right:
            - href: https://www.ebi.ac.uk/metagenomics
              text: Open MGnify
            - href: https://status.mgnify.org
              text: Service status

    sidebar:
        style: docked
        search: true

        contents:
            - href: src/docs/about.md
            - section: "Data flow"
              contents:
              - src/docs/dataflow.md
              - src/docs/multiomics_submission.md
            - section: "Analyses"
              contents:
              - src/docs/analysis/version6/analysis.md
              - src/docs/analysis/version6/amplicon.md
              - src/docs/analysis/version6/raw-reads.md
              - href: src/docs/analysis/version6/assembly.md
                contents:
                  - src/docs/analysis/version6/assembly-annotation.md
                  - src/docs/analysis/version6/virify.md
                  - src/docs/analysis/version6/mobilome.md
              - src/docs/analysis/version5/analysis.md
            - section: "Website & API"
              contents:
              - src/docs/portal.md
              - src/docs/api.md
              - src/docs/ftp.md
            - section: "API code examples"
              href: src/examples/index.qmd
              contents:
              - src/examples/python.qmd
              - src/examples/mgnipy.qmd
              - src/examples/r.qmd
              - src/examples/observable-js.qmd
              - src/examples/atlanteco_samples_map.qmd
              - src/examples/download-csv.qmd
              - src/examples/pathways.qmd
            - href: src/docs/mgnify-genomes.md
            - section: "MGnify Proteins"
              href: src/docs/mgnify-proteins.md
              contents:
                - src/docs/mgnify-proteins-web.md
                - src/docs/mgnify-proteins-sequence-search.md
                - src/docs/mgnify-proteins-big-query.qmd
                - src/docs/mgnify-proteins-parquet-queries.qmd
                - src/docs/mgnify-proteins-contig-sequences.qmd
            - href: src/docs/faqs.md
            - href: src/docs/glossary.md

        tools:
            - icon: github
              menu:
                  - text: Docs source
                    url: https://github.com/ebi-metagenomics/notebooks
                  - text: MGnify repositories
                    url: https://github.com/ebi-metagenomics
            - icon: question-circle-fill
              text: Help
              href: mailto:metagenomics-help@ebi.ac.uk
format:
    html:
        theme:
            - cosmo
            - src/static-resources/styles.scss
        toc: true
        code-overflow: wrap
        code-copy: true
