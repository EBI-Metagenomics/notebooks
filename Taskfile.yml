version: '3'

tasks:
  render-static:
    desc: Render documentation and WASM examples without executing Python or R
    cmds:
      - quarto render

  preview-static:
    desc: Preview the static site and watch for changes
    cmds:
      - quarto preview --no-browser --port 9000 --host localhost

  serve-static:
    desc: Serve the rendered site locally
    cmds:
      - python3 -m http.server 9000 --bind localhost --directory _site

  test-static:
    desc: Check study links, then render
    cmds:
      - node --test tests/static/*.test.mjs
      - quarto render
