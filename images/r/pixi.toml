[workspace]
name = "mgnify-r-notebooks"
version = "0.1.0"
description = "MGnify R notebook server environment"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
python = "3.11.*"
pip = "*"
jupyterlab = ">=4,<5"
jupyter_server = ">=2,<3"
notebook = "*"
ipykernel = "6.25.1.*"
nbformat = "*"
nbconvert = "*"
nodejs = "*"
hatchling = "*"
hatch-nodejs-version = "*"
hatch-jupyter-builder = "*"
git = "*"
r-base = "4.5.*"
r-devtools = ">=2.4,<2.5"
r-irkernel = ">=1.3,<1.4"
r-tidyverse = ">=2.0,<2.1"
r-ggplot2 = ">=4,<5"
r-dplyr = ">=1.1,<1.2"
r-reshape2 = ">=1.4,<1.5"
r-vegan = ">=2.6,<2.8"
r-tidyjson = ">=0.3,<0.4"
"r-data.table" = ">=1.14,<1.18"
r-caret = "*"
r-coin = "*"
r-ggsignif = "*"
r-magrittr = "*"
r-patchwork = "*"
r-plotroc = "*"
r-proc = "*"
r-purrr = "*"
r-rlang = "*"
r-tibble = "*"
r-tidyr = "*"
r-tidytree = "*"
r-yaml = "*"
bioconductor-phyloseq = ">=1.54,<1.55"
bioconductor-metagenomeseq = ">=1.52,<1.53"
bioconductor-siamcat = ">=2.14,<2.15"
bioconductor-pathview = ">=1.50,<1.51"
bioconductor-aldex2 = ">=1.42,<1.43"
bioconductor-keggrest = ">=1.50,<1.51"
bioconductor-ancombc = ">=2.12,<2.13"
bioconductor-biobase = ">=2.70,<2.71"
bioconductor-biocgenerics = ">=0.56,<0.57"
bioconductor-biocparallel = ">=1.44,<1.45"
bioconductor-biomformat = ">=1.38,<1.39"
bioconductor-biostrings = ">=2.78,<2.79"
bioconductor-complexheatmap = ">=2.26,<2.27"
bioconductor-deseq2 = ">=1.50,<1.51"
bioconductor-edger = ">=4.8,<4.9"
bioconductor-ggtree = ">=4.0,<4.1"
bioconductor-iranges = ">=2.44,<2.45"
bioconductor-limma = ">=3.66,<3.67"
bioconductor-mgnifyr = ">=1.6,<1.7"
bioconductor-multtest = ">=2.66,<2.67"
bioconductor-s4vectors = ">=0.48,<0.49"

[tasks]
install-kernel = "Rscript -e \"IRkernel::installspec(name = 'mgnify-r-env', displayname = 'R (mgnify-r-env)', user = FALSE)\""
start = "jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --ServerApp.allow_origin='*' --ServerApp.root_dir=/home/jovyan"
