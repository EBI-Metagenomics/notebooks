name: Static site checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.5.56'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check study links
        run: node --test tests/static/*.test.mjs
      - name: Render documentation and browser examples
        run: quarto render
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: _site
