name: Preview

on:
  workflow_dispatch:
  
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Python notebook image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./images/python/Dockerfile
          load: true
          tags: quay.io/microbiome-informatics/emg-notebooks-python.dev:latest

      - name: Build static docs image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./images/docs/Dockerfile
          load: true
          tags: notebooks-static

      - name: Quarto render
        run: |
          docker run -v $PWD:/opt/repo -w /opt/repo notebooks-static render --execute

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
