proxy:
  title: EMBL-EBI MGnify Notebook Server
  logo-url: https://raw.githubusercontent.com/EBI-Metagenomics/ebi-metagenomics-client/new-client/public/images/mgnify_logo.svg
  landing-page: /
  heartbeat-rate: 10000
  heartbeat-timeout: 60000
  port: 8080
  authentication: none
  container-wait-time: 120000
  specs:
    - id: mgnify-python-notebook-lab
      display-name: EMBL-EBI MGnify | Python Notebook Lab
      description: Python examples for accessing MGnify metagenomics data.
      container-cmd: ["start-notebook.sh", "--ServerApp.token=''", "--ServerApp.base_url=#{proxy.getRuntimeValue('SHINYPROXY_PUBLIC_PATH')}"]
      container-image: quay.io/microbiome-informatics/emg-notebooks-python.dev:latest
      container-volumes: [ "/tmp/jupyter/#{proxy.userId}/work:/home/jovyan/work"]
      port: 8888
      websocket-reconnection-mode: None
      target-path: "#{proxy.getRuntimeValue('SHINYPROXY_PUBLIC_PATH')}"
    - id: mgnify-r-notebook-lab
      display-name: EMBL-EBI MGnify | R Notebook Lab
      description: R examples for accessing MGnify metagenomics data.
      container-cmd: ["start-notebook.sh", "--ServerApp.token=''", "--ServerApp.base_url=#{proxy.getRuntimeValue('SHINYPROXY_PUBLIC_PATH')}"]
      container-image: quay.io/microbiome-informatics/emg-notebooks-r.dev:latest
      container-volumes: [ "/tmp/jupyter/#{proxy.userId}/work:/home/jovyan/work"]
      port: 8888
      websocket-reconnection-mode: None
      target-path: "#{proxy.getRuntimeValue('SHINYPROXY_PUBLIC_PATH')}"
logging:
  file:
    name: shinyproxy.log
